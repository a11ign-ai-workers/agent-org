name: project-ref-bump

# `PROJECT_REF` ADVANCES BY ITSELF (a11ign/a11ign#5151, chairman 2026-10-11). `ci.yml` runs this tool's suite against a11ign/a11ign at a pinned commit, and a pull request that carries a
# copy to a NEWER project commit is red against the old pin until somebody bumps it: agent-org#878, #884 and #1055 each stopped a worker and a bump row had to be filed by hand. This opens that
# pull request: when a11ign/a11ign `main` has a commit NEWER than the pin whose `gate` check is green, ONE bot pull request (`bot/project-ref-bump`) moves the pin there, and arms it.
# `ci-pins-the-project.test.ts` still holds the line to a full sha, and the pull request's own `gate` is the check that the tool's suite passes at the new pin: a bump that goes red
# is not merged and the pin stays.
#
# IT IS A DEFAULT-OFF FLAG, `ci.autoBumpProjectRef`, and in Actions the flag is the repository variable `CI_AUTO_BUMP_PROJECT_REF`: this runs on GitHub, not on the host, so the host's
# `machinery-canary.json` cannot reach it. Anything but `true` does nothing at all: `gh variable set CI_AUTO_BUMP_PROJECT_REF --body true --repo a11ign/agent-org` turns it on and
# deleting the variable is the revert. A bump pull request already open stays open and is closed by hand.
#
# WHO PUSHES. The branch and the pull request are written with an OCTO STS token (`project-ref-bump.sts.yaml`, as `auto-arm.yml` does for arming), never `GITHUB_TOKEN`: a pull request opened with
# `GITHUB_TOKEN` fires no `pull_request` run, so its `gate` would never start. The policy binds the token to THIS file as it is on `main`, so a branch that edits the file mints nothing.
# `workflows: write` is in the policy because the file the bump edits is a workflow; whether the Octo STS app holds it is read at the first live run, and a refusal there is a red `bump` step
# that says so, not a silent no-op.
#
# THE TRIGGERS. The hour is the cadence a pin can wait (a pull request red on a stale pin waits at most that long for the bump to OPEN). a11ign/a11ign `main` pushes cannot start a run HERE:
# a workflow in another repository would have to dispatch it, and that is a change in a11ign/a11ign, not in this file. A push to `main` here that touches `ci.yml` starts `refresh`, which
# is the other half: a pull request red on drift does not turn green by being re-run (a re-run keeps the old merge commit), so its branch is updated from `main`, as the gate's own
# `refreshFixed` does for a shared failure (`ci-failure-class.ts`). It acts only on a pull request whose newest `ci` run is red AND names `copies-drifted`.
#
# READ BEFORE WRITING. The pin and the newest green commit are read with `GITHUB_TOKEN` (a11ign/a11ign is public), and the token is minted only when there is something to write, so the
# usual hourly run, which finds the pin current, mints nothing.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/ci.yml"]

permissions:
  contents: read

env:
  PROJECT_REPOSITORY: a11ign/a11ign
  # MIRRORS `PIN_BUMP_BRANCH` in src/ci-failure-class.ts, which finds the open bump pull request by this head so a holder is told to wait only for a bump that exists;
  # `project-ref-bump-workflow.test.ts` fails if the two drift.
  BUMP_BRANCH: bot/project-ref-bump
  # How many of the project's newest commits are looked at for a green `gate`. A pin older than this many commits still moves, to the newest green one found.
  COMMITS_SCANNED: "30"
  # MIRRORS `HOLD_PREFIX` in src/pr-hold-state.ts, as `auto-arm.yml` does: a `hold:` label is the hold.
  HOLD_PREFIX: "hold:"

jobs:
  bump:
    if: github.event_name != 'push' && vars.CI_AUTO_BUMP_PROJECT_REF == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    # Two runs at once would race on one branch.
    concurrency:
      group: project-ref-bump
    steps:
      - name: The pin, and the newest project commit past it whose `gate` is green
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          raw='Accept: application/vnd.github.raw+json'
          pin=$(gh api "repos/${REPOSITORY}/contents/.github/workflows/ci.yml?ref=main" -H "$raw" | sed -n 's/^  PROJECT_REF: \([0-9a-f]\{40\}\)[[:space:]]*$/\1/p')
          if [ "${#pin}" -ne 40 ]; then
            echo "::error::PROJECT-REF-BUMP: ci.yml on main has no PROJECT_REF line holding a full commit sha, so there is nothing to move"
            exit 1
          fi
          target=""
          # Newest first. Reaching the pin ends the walk: nothing past it is newer. A commit with no `gate` run yet, or one that is red, is passed over and not waited for.
          for sha in $(gh api "repos/${PROJECT_REPOSITORY}/commits?sha=main&per_page=${COMMITS_SCANNED}" --jq '.[].sha'); do
            [ "$sha" = "$pin" ] && break
            green=$(gh api "repos/${PROJECT_REPOSITORY}/commits/${sha}/check-runs?check_name=gate&filter=latest" --jq '[.check_runs[].conclusion] | length > 0 and all(. == "success")')
            if [ "$green" = true ]; then target=$sha; break; fi
          done
          if [ -z "$target" ]; then
            echo "PROJECT-REF-BUMP: no commit past ${pin:0:9} on ${PROJECT_REPOSITORY} main has a green gate: the pin stands"
          else
            # `ahead` is the only status that is a move FORWARD: a diverged or behind commit is never a bump.
            status=$(gh api "repos/${PROJECT_REPOSITORY}/compare/${pin}...${target}" --jq .status)
            if [ "$status" != ahead ]; then
              echo "PROJECT-REF-BUMP: ${target:0:9} is ${status} of the pin ${pin:0:9}, not ahead of it: the pin stands"
              target=""
            fi
          fi
          echo "pin=${pin}" >> "$GITHUB_OUTPUT"
          echo "target=${target}" >> "$GITHUB_OUTPUT"
      - name: Mint the write token (Octo STS, `project-ref-bump.sts.yaml`) -- no fallback to `GITHUB_TOKEN`, see the header
        if: steps.newest.outputs.target != ''
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: project-ref-bump
      - name: Open or update the one bump pull request, and arm it
        if: steps.newest.outputs.target != ''
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          PIN: ${{ steps.newest.outputs.pin }}
          TARGET: ${{ steps.newest.outputs.target }}
        run: |
          set -euo pipefail
          raw='Accept: application/vnd.github.raw+json'
          workflow=.github/workflows/ci.yml
          pinned() { sed -n 's/^  PROJECT_REF: \([0-9a-f]\{40\}\)[[:space:]]*$/\1/p'; }
          main_sha=$(gh api "repos/${REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          branch_exists=false; branch_pin=""; behind=""
          if gh api "repos/${REPOSITORY}/git/ref/heads/${BUMP_BRANCH}" > /dev/null 2>&1; then
            branch_exists=true
            branch_pin=$(gh api "repos/${REPOSITORY}/contents/${workflow}?ref=${BUMP_BRANCH}" -H "$raw" | pinned)
            behind=$(gh api "repos/${REPOSITORY}/compare/${main_sha}...${BUMP_BRANCH}" --jq .behind_by)
          fi
          if [ "$branch_pin" = "$TARGET" ] && [ "$behind" = 0 ]; then
            echo "PROJECT-REF-BUMP: ${BUMP_BRANCH} already carries ${TARGET:0:9} on main's head"
          else
            # The branch is reset to main's head and ONE commit is written on it, so the pull request is always main plus one line, never a stack of bumps.
            if [ "$branch_exists" = true ]; then
              gh api -X PATCH "repos/${REPOSITORY}/git/refs/heads/${BUMP_BRANCH}" -f sha="$main_sha" -F force=true > /dev/null
            else
              gh api -X POST "repos/${REPOSITORY}/git/refs" -f ref="refs/heads/${BUMP_BRANCH}" -f sha="$main_sha" > /dev/null
            fi
            file=$(gh api "repos/${REPOSITORY}/contents/${workflow}?ref=${main_sha}")
            jq -r .content <<< "$file" | base64 -d > "${RUNNER_TEMP}/ci.yml"
            sed -i "s/^  PROJECT_REF: [0-9a-f]\{40\}\$/  PROJECT_REF: ${TARGET}/" "${RUNNER_TEMP}/ci.yml"
            [ "$(pinned < "${RUNNER_TEMP}/ci.yml")" = "$TARGET" ] || { echo "::error::PROJECT-REF-BUMP: the edit did not leave ${TARGET} on the PROJECT_REF line"; exit 1; }
            base64 -w0 "${RUNNER_TEMP}/ci.yml" > "${RUNNER_TEMP}/ci.b64"
            gh api -X PUT "repos/${REPOSITORY}/contents/${workflow}" -f message="Advance CI's PROJECT_REF to ${TARGET:0:9} (${PROJECT_REPOSITORY} main, gate green)" \
              -f branch="$BUMP_BRANCH" -f sha="$(jq -r .sha <<< "$file")" -F content=@"${RUNNER_TEMP}/ci.b64" > /dev/null
          fi
          title="Advance CI's PROJECT_REF to ${TARGET:0:9}"
          body=$(printf '%s\n' \
            "\`PROJECT_REF\` moves from \`${PIN:0:9}\` to \`${TARGET}\`, a ${PROJECT_REPOSITORY} \`main\` commit whose \`gate\` check is green." \
            "" "Changes: https://github.com/${PROJECT_REPOSITORY}/compare/${PIN}...${TARGET}" "" \
            "Opened and moved by \`.github/workflows/project-ref-bump.yml\` (flag \`ci.autoBumpProjectRef\`, variable \`CI_AUTO_BUMP_PROJECT_REF\`). This pull request's own \`gate\` is the suite run at the new pin; red, it is not merged and the pin stays." \
            "" "Closes: none -- the pin advances by itself (a11ign/a11ign#5151); no row holds this change.")
          number=$(gh api "repos/${REPOSITORY}/pulls?state=open&head=${REPOSITORY%%/*}:${BUMP_BRANCH}" --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            number=$(gh api -X POST "repos/${REPOSITORY}/pulls" -f title="$title" -f head="$BUMP_BRANCH" -f base=main -f body="$body" --jq .number)
            echo "PROJECT-REF-BUMP: opened #${number}: ${PIN:0:9} -> ${TARGET:0:9}"
          else
            gh api -X PATCH "repos/${REPOSITORY}/pulls/${number}" -f title="$title" -f body="$body" > /dev/null
            echo "PROJECT-REF-BUMP: updated #${number}: ${PIN:0:9} -> ${TARGET:0:9}"
          fi
          # Arming only ARMS the merge: the ruleset still wants `gate` and an approving review. A hold is honoured as `auto-arm.yml` honours it, and is a done and not a failure.
          holders=$(gh api "repos/${REPOSITORY}/issues/${number}/labels" | jq -r --arg prefix "$HOLD_PREFIX" '[.[].name | select(startswith($prefix))] | join(", ")')
          if [ -n "$holders" ]; then
            echo "PROJECT-REF-BUMP: not arming #${number}: held by ${holders}"
            exit 0
          fi
          gh pr merge "$number" --repo "$REPOSITORY" --auto --merge

  refresh:
    if: github.event_name == 'push' && vars.CI_AUTO_BUMP_PROJECT_REF == 'true'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Mint the write token (Octo STS, `project-ref-bump.sts.yaml`) -- no fallback to `GITHUB_TOKEN`, see the header
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ${{ github.repository }}
          identity: project-ref-bump
      - name: Update the branch of each pull request red on `copies-drifted`, once the pin has moved
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          raw='Accept: application/vnd.github.raw+json'
          workflow=.github/workflows/ci.yml
          pinned() { sed -n 's/^  PROJECT_REF: \([0-9a-f]\{40\}\)[[:space:]]*$/\1/p'; }
          before=$(gh api "repos/${REPOSITORY}/contents/${workflow}?ref=${BEFORE}" -H "$raw" | pinned)
          after=$(gh api "repos/${REPOSITORY}/contents/${workflow}?ref=${AFTER}" -H "$raw" | pinned)
          if [ "$before" = "$after" ]; then
            echo "PROJECT-REF-BUMP: this push left PROJECT_REF at ${after:0:9}: nothing waits on it"
            exit 0
          fi
          echo "PROJECT-REF-BUMP: PROJECT_REF moved ${before:0:9} -> ${after:0:9}"
          # A pull request's `gate` is red against the OLD pin and a re-run keeps its old merge commit, so the branch is updated from main: that makes a new head and a new run.
          gh api "repos/${REPOSITORY}/pulls?state=open&base=main&per_page=100" \
            | jq -r --arg repository "$REPOSITORY" '.[] | select(.head.repo.full_name == $repository) | "\(.number) \(.head.ref)"' \
            | while read -r number head; do
              run=$(gh api "repos/${REPOSITORY}/actions/runs?branch=${head}&event=pull_request&per_page=1" --jq '.workflow_runs[0] | select(. != null) | "\(.id) \(.conclusion)"')
              [ -n "$run" ] || continue
              [ "${run#* }" = failure ] || continue
              drifted=$(gh run view "${run% *}" --repo "$REPOSITORY" --log-failed | grep -c 'copies-drifted' || true)
              [ "$drifted" -gt 0 ] || continue
              if gh api -X PUT "repos/${REPOSITORY}/pulls/${number}/update-branch" > /dev/null; then
                echo "PROJECT-REF-BUMP: updated #${number} from main (red on copies-drifted, the pin has moved)"
              else
                echo "PROJECT-REF-BUMP: GitHub refused to update #${number} (a conflict?): its holder is told as before"
              fi
            done

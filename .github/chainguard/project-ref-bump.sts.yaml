# Trust policy for `.github/workflows/project-ref-bump.yml` (a11ign/a11ign#5151), Octo STS v0.11.2 syntax; the shape of `auto-arm.sts.yaml`, whose reasoning and measurements it shares.
# Every pattern is matched against the WHOLE claim, so none is anchored here.
#
# WHAT IT HOLDS, on THIS repository only (the server forces `repositories` to the one the file sits in):
#   contents: write       a branch, a commit on it, and `update-branch` (the merge into a pull request's branch)
#   pull_requests: write  open and edit the bump pull request, enable its auto-merge
#   workflows: write      the bump edits `.github/workflows/ci.yml`, and a token without it is refused any write to a workflow file
#   actions: read         `refresh` reads a pull request's failed run log to see that it names `copies-drifted`
#
# WHAT BINDS IT TO `main`: `job_workflow_ref` pinned to `@refs/heads/main` is the run of the file AS IT IS ON `main`, so a branch that edits the workflow cannot mint. `event_name` names the
# three triggers the file has: `schedule` (only ever the default branch), `workflow_dispatch` (a dispatch on any other branch fails the `job_workflow_ref` match) and `push` (the `main`
# push that touched `ci.yml`). `sub` carries IMMUTABLE ids, as in `auto-arm.sts.yaml`: for all three it is the branch ref, never a pull request.
issuer: https://token.actions.githubusercontent.com
subject_pattern: repo:a11ign@320310787/agent-org@1388747923:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: a11ign/agent-org/\.github/workflows/project-ref-bump\.yml@refs/heads/main
  event_name: schedule|workflow_dispatch|push
permissions:
  contents: write
  pull_requests: write
  workflows: write
  actions: read
